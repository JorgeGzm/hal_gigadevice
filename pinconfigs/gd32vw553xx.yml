      I2C1_SDA: 0
      SPI_NSS: 4
      SPI_MOSI: 5
      UART2_RX: 8
  PA8:
    pincodes: [K]
    afs:
      USART0_TX: 2
      UART1_RX: 3
      I2C0_SDA: 5
      I2C1_SDA: 6
  PA9:
    pincodes: [K]
    afs:
      SPI_MOSI: 0
  PA10:
    pincodes: [K]
    afs:
      SPI_MISO: 0
  PA11:
    pincodes: [K]
    afs:
      SPI_SCK: 0
  PA12:
    pincodes: [K]
    afs:
      SPI_NSS: 6
  PA13:
    pincodes: [K]
    afs:
      I2C0_SMBA: 4
      I2C1_SCL: 6
  PA14:
    pincodes: [K]
    afs:
      I2C1_SMBA: 4
      I2C1_SDA: 6
  PA15:
    pincodes: [K]
    afs:
      I2C0_SCL: 4
      I2C1_SCL: 6
  PB0:
    pincodes: [K]
    afs:
      I2C0_SCL: 6
      UART2_CTS: 10
  PB1:
    pincodes: [K]
    afs:
      I2C0_SDA: 6
      UART2_RTS: 10
  PB3:
    pincodes: [K]
