      I2C1_SCL: 6
  PB13:
    pincodes: [K]
    afs:
      I2C1_SDA: 6
  PB15:
    pincodes: [K]
    afs:
      I2C0_SCL: 4
      I2C1_SCL: 6
      UART1_TX: 7
      USART0_RX: 8
  PC0:
    pincodes: [K]
