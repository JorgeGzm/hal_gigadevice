# GD32VW553XX pin definitions
#
# Sources:
# - GD32VW553xx Datasheet (Rev 1.5), tables 2-5/2-6/2-7: SPI and I2C0/I2C1
#   alternate functions.
# - GigaDevice GD32VW55x WiFi/BLE SDK (MSDK/plf/src/uart/uart.h and
#   MBL/mainboot/mbl.c): USART0/UART1/UART2 alternate functions.
#
# NOTE: this file is NOT a complete transcription of the datasheet AF
# tables. Signals whose AF assignments were not available in the above
# sources (TIMERx channels, ADC channel inputs, I2S, QSPI flash and the
# JTAG debug port) are not listed. Pins without any known AF still get an
# ANALOG entry (used for low power mode).
#
# Pin codes:
#
# - 32 pins (QFN32): K
#
# NOTE: the exact QFN32 pin list could not be fully confirmed. Pins
# PA0-PA8, PA12-PA15, PB0, PB3, PB4, PB15, PC0-PC2, PC14 and PC15 are
# confirmed present on the GD32VW553K-START board (GD32VW553KMQ7). The
# remaining pins below (PA9-PA11, PB1, PB12, PB13, PC8) are taken from the
# family pinmap and are over-inclusively marked with pincode K.
#
# Memory codes:
#
# - 4096Kb Flash, 320Kb SRAM: M
#
# Copyright (c) 2026 GZM
# SPDX-License-Identifier: Apache 2.0

model: af

series: gd32vw553

variants:
  - pincode: K
    memories: [M]

pins:
  PA0:
    pincodes: [K]
    afs:
      USART0_TX: 0
      SPI_MOSI: 5
      UART1_CTS: 7
