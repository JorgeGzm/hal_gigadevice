# not listed. Only the QFN56 (P) package is described; the QFN36 (T) pin
# subset is not covered yet.
#
# Pin codes:
#
# - 56 pins (QFN56): P
#
# Memory codes:
#
# - 2048Kb Flash, 448Kb SRAM: I
